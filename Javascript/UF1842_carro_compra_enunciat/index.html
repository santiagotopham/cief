<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Carrito</title>
		<link rel="stylesheet" href="css/estils.css" />
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.2/css/all.min.css"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Kanit&display=swap"
			rel="stylesheet"
		/>
	</head>

	<body>
		<header>
			<h1>Carrito de la compra</h1>

			<div id="presentacio">
				<h2>Aplicación para comprar fruta</h2>
				<p>Elige la fruta que deseas haciendo click sobre su imagen.</p>
			</div>
		</header>
		<main class="container">
			<section id="productList" class="productes"></section>

			<section>
				<!-- <h2>Total carrito:</h2> -->
				<div id="totalCompra">
					<span id="total"
						><i class="fas fa-shopping-cart fa-sm"></i> Total
						Compra: <span id="preuFinal"></span
					></span>
					<ul id="carrito"></ul>
				</div>
			</section>
		</main>

		<script src="js/carrito.js"></script>
	</body>
</html>
